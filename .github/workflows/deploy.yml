# Ship the application to the dev stack. Called by pr.yml and release.yml; never run alone.
#
# Terraform builds the infrastructure by hand, from a person's machine. This workflow only
# puts the application on it: the dependency layer, the function code, the database
# setup, the policy documents and the web app. It then checks the stack answers and runs
# the evaluation.
#
# What it knows about the stack comes from SSM Parameter Store, written by Terraform.
# GitHub holds three plain variables (AWS_ROLE_ARN, AWS_REGION, ENVIRONMENT) and no secrets.

name: Deploy to dev

on:
  workflow_call:
    inputs:
      force_layer:
        description: Rebuild and publish the dependency layer even if requirements.txt is unchanged
        type: boolean
        default: false
      force_ingest:
        description: Re-ingest the policy documents even if they are unchanged
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_NAME: northwind-hr
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  FORCE_LAYER: ${{ inputs.force_layer }}
  FORCE_INGEST: ${{ inputs.force_ingest }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One deploy at a time. A second run waits, so two runs never update the same functions.
    concurrency:
      group: deploy-${{ vars.ENVIRONMENT || 'dev' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read the stack settings from SSM
        run: bash scripts/ci/load-settings.sh

      - name: Publish the dependency layer (only if requirements.txt changed)
        run: bash scripts/ci/publish-layer.sh

      - name: Deploy the function code
        run: bash scripts/ci/deploy-functions.sh

      - name: Set up the database (safe to repeat)
        run: bash scripts/ci/migrate.sh

      - name: Load the policy documents (only if they changed)
        run: bash scripts/ci/sync-documents.sh

      - name: Publish the web app
        run: bash scripts/ci/publish-frontend.sh

      - name: Smoke test and warm-up
        run: bash scripts/ci/smoke-test.sh

      # The Lambda evaluation writes build/evaluation.json. It does not fail the run on its
      # own: the gate below reads that file (for the cases that need a conversation history)
      # and decides.
      - name: Run the evaluation
        id: evaluation
        continue-on-error: true
        run: bash scripts/ci/run-evaluation.sh

      # The gate. Fails the run on a leaked secret, a regression against eval/baseline.json,
      # or a pass count under the floor. See docs/pipeline.md.
      - name: Evaluation gate
        id: gate
        run: bash scripts/ci/eval-gate.sh

      - name: Keep the evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: |
            build/evaluation.json
            eval/out/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed to ${ENVIRONMENT}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- App: ${APP_URL:-unknown}"
            echo "- Evaluation: ${{ steps.evaluation.outcome }}"
            echo "- Gate: ${{ steps.gate.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
